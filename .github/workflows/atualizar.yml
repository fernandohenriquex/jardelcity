name: Atualizar e publicar o site

on:
  schedule:
    - cron: "17 6 * * *"          # 06:17 UTC = 03:17 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Aceitar mudança grande nos números (pula só a comparação com a versão anterior)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["*.py", "config.json", "estilo.css", "busca.js", ".github/workflows/atualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes da verificação
        run: python3 testes/teste_validar.py
      - name: Campos reais da API (para conferência)
        shell: bash
        run: |
          mkdir -p relatorio
          python3 coletar.py --explorar > relatorio/explorar.txt 2>&1 || true
      - name: Coletar dados na Câmara
        shell: bash
        env:
          RADAR_DADOS: dados_novos
        run: python3 coletar.py 2>&1 | tee relatorio/coleta.txt
      - name: Verificar se a coleta está completa
        shell: bash
        run: |
          ARGS=""
          if [ "${{ inputs.forcar }}" = "true" ]; then ARGS="--forcar"; fi
          python3 validar.py dados_novos dados $ARGS 2>&1 | tee relatorio/verificacao.txt
      - name: Trocar pelos dados novos e gerar o site
        run: |
          rm -rf dados && mv dados_novos dados
          python3 gerar.py dados saida
      - name: Guardar a nova versão boa dos dados
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add dados
          if git diff --cached --quiet; then echo "dados sem mudança"; else git commit -m "Dados atualizados $(date -u +%F)" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio
          path: relatorio
          if-no-files-found: ignore

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  relatorio:
    needs: [atualizar, publicar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relatorio
          path: relatorio
        continue-on-error: true
      - name: Publicar relatório na branch status
        shell: bash
        run: |
          mkdir -p out && cp -r relatorio/. out/ 2>/dev/null || true
          {
            echo "# Última execução"
            echo "- data (UTC): $(date -u '+%F %T')"
            echo "- origem: ${{ github.event_name }}"
            echo "- execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- coleta e verificação: ${{ needs.atualizar.result }}"
            echo "- publicação no site: ${{ needs.publicar.result }}"
          } > out/resultado.md
          cd out
          git init -q -b status
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -A; git commit -qm "relatório ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" status
